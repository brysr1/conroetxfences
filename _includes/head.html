<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <meta name="theme-color" content="#0f2b46">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/android-chrome-192x192.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  {%- if site.google_analytics and jekyll.environment == 'production' %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.google_analytics }}');</script>
  {%- endif %}
  {%- if site.google_site_verification %}
  <meta name="google-site-verification" content="{{ site.google_site_verification }}">
  {%- endif %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HomeAndConstructionBusiness",
    "name": "{{ site.business.name }}",
    "url": "{{ site.url }}",
    "logo": "{{ site.url }}/assets/images/logo-76-fence.png",
    "telephone": "{{ site.business.phone_tel }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ site.business.street }}",
      "addressLocality": "{{ site.business.city }}",
      "addressRegion": "{{ site.business.state }}",
      "postalCode": "{{ site.business.zip }}",
      "addressCountry": "US"
    },
    "areaServed": ["Conroe, TX", "Willis, TX", "Panorama Village, TX", "Huntsville, TX", "Cleveland, TX", "Livingston, TX", "Lake Conroe", "Lake Livingston"],
    "branchOf": { "@type": "Organization", "name": "76 Fence", "url": "https://76fence.com/houston" }
  }
  </script>
</head>
